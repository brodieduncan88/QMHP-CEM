# QMHP-CEM machine-readable frozen requirements
#
# Generated from QMHP-CEM_v0.1_Spec.md §4 (which derives them from
# QMHP-CoPro v1.5.8f Master Edition, ADOPTED MASTER — FROZEN RELEASE).
#
# AUTHORITY: this file is authority level 3 (see spec §2.1). It is frozen at
# runtime. No code path may mutate it, and no candidate/solver/evaluator result
# may cause a value here to change. See tests/test_master_authority.py.
#
# Every block carries an explicit `classification` per spec §2.2:
#   MASTER-FROZEN           - carried by the frozen v1.5.8f Master
#   VERIFIED-COMPUTATIONAL  - August 2026 verified computational cycle
#   ENGINEERING-SEED        - CEM bootstrap assumption, NOT a QMHP requirement
#   QMHP-CEM-NORMATIVE      - convention established by this CEM release
#   ENGINEERING-RULE        - CEM engineering rule, not a frozen requirement

schema: qmhp-cem.master-requirements/0.1.0
master_revision: v1.5.8f
master_status: "ADOPTED MASTER — FROZEN RELEASE"
master_date: "2026-08-24"
spec_version: 0.1.0

# --- §4.1 Branch-A nominal device parameters -------------------------------
branch_a_device:
  classification: MASTER-FROZEN
  EC_over_h_GHz: 0.60
  EJ_over_h_GHz: 5.72
  EL_over_h_GHz: 1.58
  phi_ext: pi          # symbolic; resolved to math.pi by the loader
  logical_states: [0, 2]
  sink_state: 1

# --- §4.2 Static fluxonium calculation -------------------------------------
static_fluxonium:
  classification: MASTER-FROZEN / VERIFIED-COMPUTATIONAL
  phase_grid:
    grid_points: 3201
    phase_min: -8*pi   # symbolic; resolved by the loader
    phase_max: +8*pi
    kinetic_operator: second_difference
  reference_values:
    f01_GHz: 0.175710013
    f02_GHz: 3.581724312
    n02: numerical_floor      # sentinel, not a number
    n12: 0.659915
    sin_delta_over_2_02: 0.295705232
    richardson_curvature_GHz_per_Phi0_sq: 5064.55
    gamma_qp_over_xqp_per_s: 4.106e10

# --- §4.3 Eq.(7) dispersive diagnostic -------------------------------------
# DIAGNOSTIC quantities. The exact dressed root (§4.4) is authoritative for the
# operating point. Eq.(7) is permitted only to seed the root search (§5.2).
eq7_diagnostic:
  classification: MASTER-FROZEN
  readout_diagnostic_GHz: 6.5
  chi_MHz:
    state_0: -5.366823
    state_1: -0.305447
    state_2: 7.214942
  perturbative_root_GHz: 4.314628047

# --- §4.4 Exact dressed-system regression pins -----------------------------
dressed_system:
  classification: MASTER-FROZEN
  production_convention:
    Nq: 10
    Nph: 12
    root_GHz: 4.301974466
  high_truncation_spot_check:
    Nq: 14
    Nph: 25
    root_GHz: 4.301975383
  # Production-to-high-truncation shift is approximately +0.92 kHz and is NOT
  # an error condition.
  truncation_shift_kHz_expected: 0.92
  physical_pull_references:
    logical_pull_MHz_master_display: -9.507
    sink_pull_MHz_master_display: 8.721
    sink_logical_contrast_MHz: 18.228
    sink_line_GHz: 4.310696
    dressed_f12_GHz: 3.395056
  # Extra precision available from the verified computational artifacts.
  # The consolidated Master displays the pulls rounded to three decimals; the
  # extra digits are NOT separately printed Master values.
  physical_pull_regression:
    classification: VERIFIED-COMPUTATIONAL
    logical_pull_MHz: -9.507089
    sink_pull_MHz: 8.721155

# --- §4.5 F8 Purcell regression --------------------------------------------
purcell_f8:
  classification: MASTER-FROZEN
  executable_definition: "Gamma_P = kappa(omega_if) * |<f|a|i>|^2"
  dressed_weight: 0.01182198
  # DIFFERENT QUANTITY. Must never be substituted for dressed_weight (§5.3).
  bare_admixture_overlap_approx: 0.011815
  filter_constraint:
    dressed_emission_GHz: 3.395056
    minimum_stopband_dB: 34.0
    target_stopband_dB: 36.0

# --- §4.6 Collision / tolerance reference ----------------------------------
collision:
  classification: MASTER-FROZEN
  minimum_abs_omega24_minus_readout_MHz: 13.0

fabrication_ensemble:
  classification: MASTER-FROZEN
  # Frozen ensemble REPORTING reference. Legacy exact finite-sample identities
  # and counts are NOT reproducibility targets.
  pooled_rejection_rate: 0.0666
  wilson_95:
    low: 0.0612
    high: 0.0721
  draws: 20
  devices_per_draw: 400
  legacy_finite_sample_counts_are_reproducibility_targets: false

tolerance_rng_convention:
  # NEW normative convention for future CEM runs. This must never be described
  # as exact reproduction of legacy AMD-C finite samples.
  classification: QMHP-CEM-NORMATIVE
  rng: numpy.random.default_rng
  sigma_fraction:
    EC: 0.02
    EJ: 0.02
    EL: 0.02
  draw_order: [EC, EJ, EL]
  reproduces_legacy_finite_samples: false

# --- §5.5 Coupling-extraction consistency rule -----------------------------
coupling_extraction:
  classification: ENGINEERING-RULE
  max_relative_disagreement: 0.10
  on_exceed: EXTRACTION-INCONSISTENT
  silent_averaging_permitted: false

# --- §4.7 QEC reference values (provenance / golden testing) ---------------
# Not required to make Object 001 geometry. Retained as golden research
# references. The correct matched-screen conclusion remains
# "NO SEPARATION ESTABLISHED" without location credit.
qec_references:
  classification: MASTER-FROZEN
  branch_A_Pu_per_round: 0.00850
  branch_A_Pe_per_round: 0.01543
  branch_A_round_time_us: 20.0
  branch_C_round_time_us_prior: 13.5
  matched_hazard_ratio:
    d3: {central: 0.94, ci95: [0.88, 1.01]}
    d5: {central: 0.92, ci95: [0.79, 1.08]}
    d7: {central: 1.15, ci95: [0.97, 1.36]}
  ideal_free_location_HR:
    d3: 0.43
    d5: 0.20
    d7: 0.15
  break_even_location_efficiency:
    d3: 0.524
    d5: 0.598
  matched_screen_conclusion: "NO SEPARATION ESTABLISHED"

# --- §6.6 P6-E6 joint acceptance limits ------------------------------------
# All four conditions are required. v0.1 has no measured hardware inputs, so
# the measured gate returns HARDWARE-GATED (see validation_gates.yaml).
p6e6_joint_acceptance:
  classification: MASTER-FROZEN
  f_star:
    d3: 0.524
    d5: 0.598
  p_induced_max_per_data_qubit_round_equivalent: 0.001
  Pu_total_max_per_round: 0.01
  logical_advantage_confidence_min: 0.95
  comparison_basis: equal_wall_clock

# --- §7.3 Frozen coordinate / unit convention ------------------------------
conventions:
  classification: QMHP-CEM-NORMATIVE
  origin: "centre of top surface of chip substrate"
  plane_axes: "+X/+Y = chip plane"
  z_axis: "+Z = from chip toward package lid"
  geometry_unit: mm
  rf_frequency_unit: GHz
  rf_offset_unit: MHz

