# Order-1 mesh-refinement check, one approved level per run.
#
# NOT part of default CI (spec §12.8). Builds the pinned Palace container
# (layer cache shared with the golden-run workflow) and executes ONE level of
# the order-1 ladder of the same declared S1 chip cell:
#
#   order 1, halo 0.08 mm, the level named in .github/ladder-approval.json
#
# Fixed and not settable from here: element order 1, halo 0.08 mm, the
# 250 000-DOF ENGINEERING-RULE, the 45-minute per-solve cap, and the
# prospective admission, matching and magnitude-comparison rules. The driver
# refuses to launch a level whose measured DOF exceeds the budget.
#
# The dry runs for levels 2 and 3 are offline (gmsh only, no solver) and run
# unconditionally, so the DOF of the level NOT being run is measured and
# recorded before anyone decides whether to approve it.
#
# This performs NO coupling extraction: no Route A inversion, no g, no
# charging energy, no capacitance, no circuit parameter. It records the mode
# list, the admitted set, the correspondence with the preserved level-1 rung,
# wall time, Palace's own timers, and the port-field test of the
# supported-but-unproven port-stiffness explanation.
#
# Field output. Solver.Eigenmode.Save is enabled, and the resulting paraview/
# tree is uploaded as an artifact and NOT committed: it is large, and the
# quantitative test uses surface-Q.csv, which is committed.
#
# Local refinement. The approval record may carry an optional
# `port_refinement` block ({id, h_port_mm, pad_mm, transition_mm}), which runs
# the approved level with one extra local size constraint over a declared box
# around the port face, holding the distant size prescription, the geometry,
# the materials, the port and every solver setting fixed. Such a run gets its
# own record id and is deliberately kept out of the ladder's convergence fit,
# because it is not a point on a sequence in h. The numbers come from the
# approval record; no code change can introduce a refinement.
#
# Triggers. As with the pilot, a level is something a human approves, not
# something a commit starts: this runs when `.github/ladder-approval.json` is
# committed on a `palace/**` branch, so the trigger is the approval record.

name: Palace order-1 ladder

on:
  push:
    branches:
      - "palace/**"
    paths:
      - ".github/ladder-approval.json"
  workflow_dispatch:
    inputs:
      level:
        description: "Ladder level to run (2 or 3)"
        default: "2"
      commit_results:
        description: "Commit results/COUPLED-LADDER-O1-* back to this branch"
        type: boolean
        default: true
      prepare_only:
        description: "Mesh and write the config without launching Palace"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: palace-order1-ladder-${{ github.ref }}
  cancel-in-progress: false   # a level that is running is not superseded

env:
  IMAGE: qmhp-cem/palace:0.13.0
  COMMIT_RESULTS: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_results }}
  PREPARE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only }}

jobs:
  ladder:
    name: build the image, run one approved level
    runs-on: ubuntu-latest
    # One solve capped at 45 min, plus the image build and the evidence
    # reserve. Well inside the ceiling.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Show the approval this run executes under
        id: approval
        run: |
          echo "::group::.github/ladder-approval.json"
          cat .github/ladder-approval.json
          echo "::endgroup::"
          level="$(python3 -c "import json;print(json.load(open('.github/ladder-approval.json'))['level'])")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then level="${{ inputs.level }}"; fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "running level $level"
          python3 scripts/describe_ladder_approval.py --approval .github/ladder-approval.json

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the Palace image (pinned base, apt snapshot, Palace tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/palace.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image identity
        run: |
          docker image inspect "$IMAGE" --format 'id={{.Id}}  repo-digests={{json .RepoDigests}}'
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/palace/PALACE_VERSION /opt/palace/PALACE_COMMIT'

      - name: Runner resources
        run: nproc; free -g; df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install gmsh runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 libxfixes3 libxext6 libfontconfig1

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Assert the mesher imports
        run: uv run python -c "import gmsh; print('gmsh', gmsh.__version__)"

      - name: The approved level
        id: ladder
        continue-on-error: true
        run: |
          args=()
          if [ "$PREPARE_ONLY" = "true" ]; then args+=(--prepare-only); fi
          uv run python scripts/palace_order1_ladder.py \
            --level "${{ steps.approval.outputs.level }}" \
            --np 1 --results-root results \
            --record-pointer "$RUNNER_TEMP/ladder-record" \
            --field-output-dir "$RUNNER_TEMP/paraview" "${args[@]}"

      - name: Identify this run's record
        id: record
        if: always()
        run: |
          record="$(cat "$RUNNER_TEMP/ladder-record" 2>/dev/null || true)"
          if [ -z "$record" ] || [ ! -d "$record" ]; then
            echo "no record directory was created (ladder step: ${{ steps.ladder.outcome }})"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "record directory: $record"
          echo "path=$record" >> "$GITHUB_OUTPUT"
          echo "LADDER_RECORD=$record" >> "$GITHUB_ENV"

      - name: Report
        if: always() && steps.record.outputs.path != ''
        run: |
          for f in "$LADDER_RECORD"/report.md; do
            [ -f "$f" ] || { echo "(missing) $f"; continue; }
            echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
          done
          log="$(find "$LADDER_RECORD" -name palace_log.txt | head -1)"
          if [ -n "$log" ]; then echo "::group::palace log (tail)"; tail -120 "$log"; echo "::endgroup::"; fi
          for csv in surface-Q.csv domain-E.csv port-EPR.csv eig.csv; do
            f="$(find "$LADDER_RECORD" -name "$csv" | head -1)"
            [ -n "$f" ] || continue
            echo "::group::$csv"; cat "$f"; echo "::endgroup::"
          done

      - name: Verify the record manifest
        id: manifest
        if: always() && steps.record.outputs.path != ''
        continue-on-error: true
        run: uv run cem verify-results "$LADDER_RECORD"

      - name: Assert the preserved pilot record is untouched
        if: always()
        run: |
          uv run cem verify-results results/COUPLED-PILOT-20260916T035733Z
          test -z "$(git status --porcelain results/COUPLED-PILOT-20260916T035733Z)" \
            || { echo "the preserved pilot record changed"; git status --porcelain results/COUPLED-PILOT-20260916T035733Z; exit 1; }

      - name: Upload the record
        if: always() && steps.record.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: order1-ladder-${{ github.run_id }}
          path: ${{ steps.record.outputs.path }}
          if-no-files-found: warn

      - name: Upload the field output (not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order1-ladder-fields-${{ github.run_id }}
          path: ${{ runner.temp }}/paraview
          if-no-files-found: warn

      # The level-2 rung committed a 123 MB ParaView tree that both this file
      # and the approval record said would be uploaded and not committed.
      # Nothing checked. This is the check.
      - name: Refuse unexpected file kinds in the evidence commit
        if: always() && steps.record.outputs.path != '' && env.COMMIT_RESULTS == 'true'
        run: uv run python scripts/check_record_files.py "$LADDER_RECORD"

      - name: Commit the record to the branch
        if: always() && env.COMMIT_RESULTS == 'true'
        run: |
          if [ -z "$LADDER_RECORD" ]; then echo "no record to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LADDER_RECORD"
          headline="$(uv run python scripts/describe_ladder_approval.py --headline "$LADDER_RECORD/summary.json")"
          git commit -m "Record order-1 ladder ${{ github.run_id }}: ${headline}" \
            -m "One approved level, order 1, halo 0.08 mm, inside the 250k DOF rule and the 45 min cap." \
            -m "No coupling extraction, no Route A/B. Field output uploaded as an artifact, not committed." \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Fail the job if the level or the manifest check did not succeed
        if: always() && (steps.ladder.outcome != 'success' || steps.manifest.outcome == 'failure')
        run: |
          echo "ladder step    : ${{ steps.ladder.outcome }}"
          echo "manifest check : ${{ steps.manifest.outcome }}"
          exit 1
