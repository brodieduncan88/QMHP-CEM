# The paired static-vs-band refinement test: ONE approved attempt, three nested levels.
#
# PREPARED, NOT APPROVED. workflow_dispatch ONLY - no push, no pull_request, no schedule,
# no workflow_run - and inert besides: the driver refuses unless a committed human
# approval (experiments/static-band-pairing/PAIRING-APPROVAL.json) binds the
# pre-declaration, every code file, the inputs, this workflow, AND this run's number with
# attempt 1. This workflow never writes that approval.
#
# What one attempt does: build the pinned Palace image exactly as the order-1 ladder
# does; run Palace eigenmode on the committed L2 mesh at box levels 0, 1, 2 (the configs
# are generated by the driver and checked against the pre-declared digests); compute the
# static capacitance on the mesh Palace actually refined (SaveAdaptMesh); verify every
# refinement step is nested; decide by the frozen table; write manifest.sha256 from the
# driver; verify it again here; refuse unexpected file kinds; commit the record. The
# refined MFEM meshes are uploaded as an artefact and NEVER committed.
#
# No ${{ }} expansion appears inside any run: script. Inputs reach the shell as env data.

name: Paired static-vs-band refinement test (one approved attempt)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: run-the-approved-pairing-attempt"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: static-band-pairing
  cancel-in-progress: false

env:
  IMAGE: qmhp-cem/palace:0.13.0
  APPROVAL: experiments/static-band-pairing/PAIRING-APPROVAL.json

jobs:
  pairing:
    name: one approved attempt at the paired static-vs-band test
    runs-on: ubuntu-latest        # the ladder's runner class; no escalation
    timeout-minutes: 180          # WORKFLOW budget; each solve is capped at 2700 s inside
    steps:
      - name: Refuse an unconfirmed dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}      # DATA, not shell source
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "run-the-approved-pairing-attempt" ]; then
            echo "REFUSED: confirmation string not given; nothing was run." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Refuse unless the reviewed approval is committed
        run: |
          set -euo pipefail
          if [ ! -f "$APPROVAL" ]; then
            echo "REFUSED: $APPROVAL is absent. The paired test is PREPARED, NOT" >&2
            echo "APPROVED. A dispatch does not arm it: a human must commit the reviewed" >&2
            echo "approval, which binds this exact run number." >&2
            exit 1
          fi
          sha256sum "$APPROVAL"

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the Palace image (pinned base, apt snapshot, Palace tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/palace.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image identity, and refuse an image that is not the pinned Palace commit
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE" --format 'id={{.Id}}  repo-digests={{json .RepoDigests}}'
          commit="$(docker run --rm --network none --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/palace/PALACE_COMMIT')"
          echo "PALACE_COMMIT=$commit"
          test "$commit" = "a61c8cbe0cacf496cde3c62e93085fae0d6299ac"

      - name: Runner resources
        run: nproc; free -g; df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: THE ONE APPROVED ATTEMPT
        id: attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pairing"
          uv run python experiments/static-band-pairing/pairing_driver.py --execute \
            --runtime docker --image "$IMAGE" --scratch "$RUNNER_TEMP/pairing"

      - name: Identify this run's record
        id: record
        if: always()
        run: |
          set -euo pipefail
          rec="$(ls -d results/STATIC-BAND-PAIRING-* 2>/dev/null | head -1 || true)"
          echo "path=$rec" >> "$GITHUB_OUTPUT"
          echo "record: ${rec:-none}"

      - name: Verify the record manifest
        id: manifest
        if: always() && steps.record.outputs.path != ''
        continue-on-error: true
        env:
          RECORD: ${{ steps.record.outputs.path }}
        run: uv run cem verify-results "$RECORD"

      - name: Upload the record and the refined meshes (the meshes are never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-band-pairing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/STATIC-BAND-PAIRING-*
            ${{ runner.temp }}/pairing
          if-no-files-found: warn
          retention-days: 90

      - name: Refuse unexpected file kinds in the evidence commit
        id: kinds
        if: always() && steps.record.outputs.path != ''
        continue-on-error: true
        env:
          RECORD: ${{ steps.record.outputs.path }}
        run: uv run python scripts/check_record_files.py "$RECORD"

      - name: Commit the record to the branch
        if: always() && steps.record.outputs.path != '' && steps.kinds.outcome == 'success'
        env:
          RECORD: ${{ steps.record.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RECORD"
          git commit -m "Record the paired static-vs-band test: $(basename "$RECORD")" -m "Workflow run: $RUN_URL"
          git push origin "HEAD:$BRANCH"

      - name: Fail the job unless the attempt, the manifest and the file-kind gate succeeded
        if: always()
        env:
          ATTEMPT: ${{ steps.attempt.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          KINDS: ${{ steps.kinds.outcome }}
        run: |
          echo "attempt=$ATTEMPT manifest=$MANIFEST kinds=$KINDS"
          test "$ATTEMPT" = "success" && test "$MANIFEST" = "success" && test "$KINDS" = "success"
