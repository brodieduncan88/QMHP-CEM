# Palace golden run: the spec §10.3 proof of the v0.2 execution path.
#
# NOT part of default CI (spec §12.8): this job builds the pinned Palace
# container from docker/palace.Dockerfile (Palace v0.13.0 and its superbuild
# dependencies: 818 s for the superbuild on a 4-vCPU hosted runner in run
# 34917157266, under two minutes once the layer cache is warm) and then
# executes the frozen golden candidate in it. Every outcome writes
# results/PALACE-GOLDEN-<UTC>/ with the execution record, the Palace log, the
# input and output hashes and the gate report. Every run uploads that record.
# Repository writeback is a separate, least-privilege job and is available only
# on an explicitly opted-in manual dispatch; the solver job receives a
# read-only token and never writes to the branch.
#
# Trigger: manual dispatch only. A Palace solve is a consequential execution
# (CLAUDE.md sections 2-3), so no push, pull request or schedule starts it. The
# first job, `authorize`, runs scripts/palace_dispatch_gate.py and refuses the
# dispatch unless `expected_sha` equals the executed commit and
# `declaration_ref` names a committed predeclaration under
# .github/palace-declarations/ that pins this workflow, every input, the
# approval reference and a budget within the job timeout. The solving job then
# waits on the protected `palace-solver` environment, whose required reviewer
# is the human approval. A maintainer may still opt into committing the exact
# uploaded record; the writeback job cannot run for a tag.
#
# The record directory this run created is identified by the pointer file the
# harness writes, never by globbing results/PALACE-GOLDEN-*: earlier records
# are committed alongside it. Its manifest is re-hashed and a mismatch fails
# the job, after the record has been uploaded and, when explicitly requested,
# written back for inspection.

name: Palace golden run

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-character hash of the commit being dispatched (must equal the executed commit)"
        required: true
        type: string
      declaration_ref:
        description: "Committed predeclaration, e.g. .github/palace-declarations/<name>.json"
        required: true
        type: string
      approval_ref:
        description: "Where the owner approved this declaration (must equal the declaration's approval_ref)"
        required: true
        type: string
      mpi_processes:
        description: "MPI processes for the Palace run"
        default: "1"
        type: string
      commit_results:
        description: "Commit this run's exact record back to the selected branch"
        type: boolean
        default: false
      run_sweep:
        description: "Also run the 3x3 Object 001 sweep with Palace (uploaded as an artifact only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: palace-golden-${{ github.ref }}
  cancel-in-progress: false  # an approved solve is never silently superseded by a later dispatch

env:
  IMAGE: qmhp-cem/palace:0.13.0
  MPI_PROCESSES: ${{ inputs.mpi_processes }}
  # Repository writeback is not represented as an environment value: the
  # separate job's condition is the authority boundary.
  RUN_SWEEP: ${{ inputs.run_sweep }}

jobs:
  # No solver step runs until this job passes. It checks consistency only;
  # the human approval is the palace-solver environment's required reviewer.
  authorize:
    name: check the dispatch against its predeclaration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse unless a matching predeclaration is committed
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/palace_dispatch_gate.py --workflow palace-golden --timeout-cap-minutes 360

  golden:
    name: build the image, run the golden candidate
    needs: authorize
    environment: palace-solver
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      record_created: ${{ steps.package.outputs.record_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Palace superbuild needs several GB of scratch; hosted runners
      # ship large toolchains this job never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the Palace image (pinned base, apt snapshot, Palace tag)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/palace.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image identity
        run: |
          docker image inspect "$IMAGE" --format 'id={{.Id}}  repo-digests={{json .RepoDigests}}'
          docker image inspect "$IMAGE" --format '{{json .Config.Labels}}'
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/palace/PALACE_VERSION /opt/palace/PALACE_COMMIT'
          docker run --rm --network none "$IMAGE" --help | head -n 3

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install gmsh runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 libxfixes3 libxext6 libfontconfig1

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Assert the mesher imports
        run: uv run python -c "import gmsh; print('gmsh', gmsh.__version__)"

      - name: Golden candidate run
        id: golden
        continue-on-error: true
        run: uv run python scripts/palace_golden_run.py --np "$MPI_PROCESSES" --results-root results --record-pointer "$RUNNER_TEMP/palace-golden-record"

      # The harness wrote the path of the directory it created; that path,
      # not a glob over results/, is what every later step acts on.
      - name: Identify this run's record
        id: record
        if: always()
        run: |
          record="$(cat "$RUNNER_TEMP/palace-golden-record" 2>/dev/null || true)"
          if [ -z "$record" ] || [ ! -d "$record" ]; then
            echo "no record directory was created by this run (golden step: ${{ steps.golden.outcome }})"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "record directory: $record"
          echo "path=$record" >> "$GITHUB_OUTPUT"
          echo "GOLDEN_RECORD=$record" >> "$GITHUB_ENV"

      - name: Execution record, gate report and Palace log
        if: always() && steps.record.outputs.path != ''
        run: |
          shopt -s nullglob
          for f in "$GOLDEN_RECORD"/execution_record.json "$GOLDEN_RECORD"/*/gate_report.json "$GOLDEN_RECORD"/*/solver/palace_run.json "$GOLDEN_RECORD"/*/solver/postpro/eig.csv "$GOLDEN_RECORD"/*/solver/palace_log.txt; do
            # A run that died before writing a file (cancelled, timed out) still
            # gets the rest of its diagnostics printed.
            [ -f "$f" ] || { echo "(missing) $f"; continue; }
            echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
          done

      # A mismatch fails this step (exit 5) and, through the last step, the
      # job; the record is still uploaded and committed below so the failed
      # artefacts can be inspected.
      - name: Verify the record manifest
        id: manifest
        if: always() && steps.record.outputs.path != ''
        continue-on-error: true
        run: uv run cem verify-results "$GOLDEN_RECORD"

      - name: Real-execution test
        if: always()
        run: uv run pytest -q -rs -m palace tests/test_palace.py

      - name: Object 001 3x3 sweep with Palace (artifact only, not committed)
        if: env.RUN_SWEEP == 'true' && steps.golden.outcome == 'success'
        continue-on-error: true
        run: uv run cem sweep sweeps/object001_grid.yaml --solver palace --results-root sweep-results

      - name: Package the exact record for optional writeback
        id: package
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${GOLDEN_RECORD:-}" ] || [ ! -d "$GOLDEN_RECORD" ]; then
            echo "record_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          record_name="$(basename "$GOLDEN_RECORD")"
          case "$record_name" in
            PALACE-GOLDEN-*) ;;
            *) echo "refusing unexpected record name: $record_name" >&2; exit 1 ;;
          esac
          mkdir -p workflow-artifacts
          tar -C results -czf workflow-artifacts/palace-golden-writeback.tar.gz "$record_name"
          (cd workflow-artifacts && sha256sum palace-golden-writeback.tar.gz \
            > palace-golden-writeback.sha256)
          echo "record_created=true" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palace-golden-${{ github.run_id }}
          path: |
            ${{ steps.record.outputs.path }}
            sweep-results
            workflow-artifacts
          if-no-files-found: warn

      - name: Fail the job if the golden run or the manifest check did not succeed
        if: always() && (steps.golden.outcome != 'success' || steps.manifest.outcome == 'failure')
        run: |
          echo "golden run step: ${{ steps.golden.outcome }}"
          echo "manifest check : ${{ steps.manifest.outcome }}"
          exit 1

  # No solver, build or third-party build action receives a write token. This
  # small job alone may write, and only after a maintainer explicitly opts in
  # on a manual branch dispatch. The archive is the exact record uploaded by
  # the read-only job; its checksum and path are checked before extraction.
  writeback:
    name: commit the dispatched record
    needs: golden
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      inputs.commit_results &&
      needs.golden.outputs.record_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Download this run's record archive
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name "palace-golden-$RUN_ID" --dir "$RUNNER_TEMP/writeback"

      - name: Verify, extract and commit only the record
        env:
          TARGET_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/writeback/workflow-artifacts/palace-golden-writeback.tar.gz"
          checksum="$RUNNER_TEMP/writeback/workflow-artifacts/palace-golden-writeback.sha256"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
          record_name="$(python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              members = archive.getmembers()
          if not members:
              raise SystemExit("refusing an empty record archive")
          roots = set()
          for member in members:
              path = pathlib.PurePosixPath(member.name)
              if path.is_absolute() or ".." in path.parts or not path.parts:
                  raise SystemExit(f"refusing unsafe archive path: {member.name}")
              if member.issym() or member.islnk():
                  raise SystemExit(f"refusing archive link: {member.name}")
              roots.add(path.parts[0])
          if len(roots) != 1:
              raise SystemExit(f"refusing multiple archive roots: {sorted(roots)}")
          print(roots.pop())
          PY
          )"
          case "$record_name" in
            PALACE-GOLDEN-*) ;;
            *) echo "refusing unexpected archive root: $record_name" >&2; exit 1 ;;
          esac
          mkdir -p results
          if [ -e "results/$record_name" ]; then
            echo "refusing to overwrite existing record: results/$record_name" >&2
            exit 1
          fi
          tar -xzf "$archive" -C results
          record="results/$record_name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$record"
          git commit -m "Record Palace golden run $RUN_ID" \
            -m "Workflow run: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"
