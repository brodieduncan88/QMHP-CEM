# Default CI (spec §12.8).
#
# Must NOT require Palace, openEMS, HFSS, Sonnet, COMSOL or physical hardware.
# The mock solver alone carries the pipeline check.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (uv run pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Pin the interpreter. requires-python is >=3.11 and uv.lock carries
          # forked resolutions, so the runner's default Python decides which
          # dependency set is installed; on >=3.12 that is not the set this
          # lock was verified against. Without this, whether CI is green
          # depends on the runner image rather than on the commit.
          python-version: "3.11"

      # gmsh (the `palace` extra) links libGLU even when used headless, so the
      # mesher cannot import without it. This is a system library, not a
      # solver: default CI still requires no Palace container (spec §12.8).
      - name: Install gmsh runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 libxfixes3 libxext6 libfontconfig1

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      # The Palace path is exercised in CI up to the container boundary
      # (mesh generation, config, parsers on fixtures). If gmsh cannot import,
      # those tests would skip and CI would still be green, so assert it here.
      - name: Assert the mesher imports
        run: uv run python -c "import gmsh; print('gmsh', gmsh.__version__)"

      - name: Verify frozen master provenance
        run: uv run cem verify-master

      - name: Verify vendored release bundle integrity
        run: uv run python scripts/verify_reference_bundle.py

      - name: Run tests
        run: uv run pytest -q -rs

      - name: Acceptance — 3x3 Object 001 mock sweep
        run: uv run cem sweep sweeps/object001_grid.yaml --solver mock

  # The approved secret scanner (CLAUDE.md §10). Read-only: it checks out the tree,
  # scans it and writes nothing. The scanner is standalone and version-pinned —
  # scripts/secret_scan.py builds exactly one gitleaks module version, whose hash the
  # Go checksum database verifies, into a cache outside the working tree. Nothing is
  # vendored and no scanner binary is committed. A scanner that cannot be provisioned,
  # is the wrong version, or exits for any reason other than a clean-or-findings
  # verdict BLOCKS this job (exit 3); a blocked scan is never a pass.
  secrets:
    name: secret scan (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The pinned module declares a newer toolchain than this line; Go's default
      # GOTOOLCHAIN=auto fetches it from the same module proxy that serves the pin.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Scanner provenance
        run: python3 scripts/secret_scan.py --print-provenance

      - name: Secret scan (checked-out tree)
        run: python3 scripts/secret_scan.py --tree

  dotnet:
    name: dotnet (PicoGK geometry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      # PicoGK 2.3.0 ships no Linux native runtime, so on this runner the tests cover
      # the managed layer only: the layout and its analytic acceptance checks, the STL
      # read-back check, the CLI exit codes and the refusal to run without the runtime.
      # The native tests report inconclusive here; picogk-native below runs them.
      - name: Restore application and test dependencies
        run: dotnet restore geometry/package_picogk/tests/QmhpCem.Geometry.Tests.csproj

      - name: Build application and tests
        run: dotnet build geometry/package_picogk/tests/QmhpCem.Geometry.Tests.csproj -c Release --no-restore

      - name: Test the geometry generator (managed layer)
        run: dotnet test geometry/package_picogk/tests/QmhpCem.Geometry.Tests.csproj -c Release --no-build --no-restore

  # The real PicoGK kernel. PicoGK 2.3.0 ships native code only for osx-arm64 and
  # win-x64, and its osx-arm64 library is built for macOS 26.5 or later (Mach-O
  # LC_BUILD_VERSION minos), so this job pins macos-26 rather than macos-latest.
  # QMHP_REQUIRE_PICOGK_RUNTIME=1 turns a runtime that fails to load into a test
  # failure instead of an inconclusive skip. This builds geometry only: no solver.
  picogk-native:
    name: PicoGK geometry (macOS 26 arm64, native runtime)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Restore application and test dependencies
        run: dotnet restore geometry/package_picogk/tests/QmhpCem.Geometry.Tests.csproj

      - name: Build application and tests
        run: dotnet build geometry/package_picogk/tests/QmhpCem.Geometry.Tests.csproj -c Release --no-restore

      - name: Test the geometry generator, native runtime required
        env:
          QMHP_REQUIRE_PICOGK_RUNTIME: "1"
        run: dotnet test geometry/package_picogk/tests/QmhpCem.Geometry.Tests.csproj -c Release --no-build --no-restore

      - name: Generate the Object 001 seed geometry
        run: |
          dotnet run --project geometry/package_picogk/QmhpCem.Geometry.csproj -c Release --no-restore -- \
            --candidate geometry/package_picogk/tests/fixtures/object001_seed.candidate.json \
            --output "$RUNNER_TEMP/object001-seed"
          shasum -a 256 "$RUNNER_TEMP/object001-seed"/*

      - name: Upload the seed geometry
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object001-seed-geometry-${{ github.sha }}
          path: ${{ runner.temp }}/object001-seed
          if-no-files-found: error
          retention-days: 30
