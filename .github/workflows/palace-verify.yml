# Palace mesh-refinement and height-sensitive verification (spec §15).
#
# NOT part of default CI (spec §12.8). Builds the pinned Palace container
# (layer cache shared with the golden-run workflow) and executes the frozen
# campaign in solvers/palace/verification.py through
# scripts/palace_verify_campaign.py: three meshes of the 22 x 22 x 1.5 mm box,
# the auxiliary 22 x 22 x 7.0/7.7 mm height benchmark, and the bounded
# Object 001 height attempts. Every outcome writes results/PALACE-VERIFY-<UTC>/
# with the frozen definition, every mesh and input deck, Palace's raw output,
# typed results, comparison tables, mode-matching decisions, the summary, the
# report and a manifest, which is re-hashed (a mismatch fails the job) and
# uploaded. Repository writeback is isolated in a separate least-privilege job
# and requires an explicit opt-in on a manual branch dispatch. The solver job
# receives a read-only token and never writes to the repository.
#
# Trigger: manual dispatch only. A Palace solve is a consequential execution
# (CLAUDE.md sections 2-3), so no push, pull request or schedule starts it. The
# first job, `authorize`, runs scripts/palace_dispatch_gate.py and refuses the
# dispatch unless `expected_sha` equals the executed commit and
# `declaration_ref` names a committed predeclaration under
# .github/palace-declarations/ that pins this workflow, every input, the
# approval reference and a budget within the job timeout. The solving job then
# waits on the protected `palace-solver` environment, whose required reviewer
# is the human approval. A maintainer may still opt into committing the exact
# uploaded record; the writeback job cannot run for a tag.

name: Palace verification campaign

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full 40-character hash of the commit being dispatched (must equal the executed commit)"
        required: true
        type: string
      declaration_ref:
        description: "Committed predeclaration, e.g. .github/palace-declarations/<name>.json"
        required: true
        type: string
      approval_ref:
        description: "Where the owner approved this declaration (must equal the declaration's approval_ref)"
        required: true
        type: string
      only:
        description: "Space-separated run names to execute (empty = the whole campaign)"
        default: ""
        type: string
      commit_results:
        description: "Commit this run's exact record back to the selected branch"
        type: boolean
        default: false
      no_probes:
        description: "Omit field probes (only for an image built without GSLIB)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: palace-verify-${{ github.ref }}
  cancel-in-progress: false  # an approved campaign is never silently superseded

env:
  IMAGE: qmhp-cem/palace:0.13.0
  ONLY: ${{ inputs.only || '' }}
  NO_PROBES: ${{ inputs.no_probes }}

jobs:
  # No solver step runs until this job passes. It checks consistency only;
  # the human approval is the palace-solver environment's required reviewer.
  authorize:
    name: check the dispatch against its predeclaration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse unless a matching predeclaration is committed
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/palace_dispatch_gate.py --workflow palace-verify --timeout-cap-minutes 350

  verify:
    name: build the image, run the verification campaign
    needs: authorize
    environment: palace-solver
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      record_created: ${{ steps.package.outputs.record_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the Palace image (pinned base, apt snapshot, Palace tag)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/palace.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image identity
        run: |
          docker image inspect "$IMAGE" --format 'id={{.Id}}  repo-digests={{json .RepoDigests}}'
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/palace/PALACE_VERSION /opt/palace/PALACE_COMMIT; echo "OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS OMP_NUM_THREADS=$OMP_NUM_THREADS"'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install gmsh runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 libxfixes3 libxext6 libfontconfig1

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Assert the mesher imports
        run: uv run python -c "import gmsh; print('gmsh', gmsh.__version__)"

      - name: Verification campaign
        id: campaign
        continue-on-error: true
        run: |
          args=()
          for name in $ONLY; do args+=(--only "$name"); done
          if [ "$NO_PROBES" = "true" ]; then args+=(--no-probes); fi
          uv run python scripts/palace_verify_campaign.py --np 1 --results-root results --record-pointer "$RUNNER_TEMP/palace-verify-record" "${args[@]}"

      - name: Identify this run's record
        id: record
        if: always()
        run: |
          record="$(cat "$RUNNER_TEMP/palace-verify-record" 2>/dev/null || true)"
          if [ -z "$record" ] || [ ! -d "$record" ]; then
            echo "no record directory was created by this run (campaign step: ${{ steps.campaign.outcome }})"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "record directory: $record"
          echo "path=$record" >> "$GITHUB_OUTPUT"
          echo "VERIFY_RECORD=$record" >> "$GITHUB_ENV"

      - name: Report and summary
        if: always() && steps.record.outputs.path != ''
        run: |
          for f in "$VERIFY_RECORD"/report.md "$VERIFY_RECORD"/summary.json "$VERIFY_RECORD"/campaign.sha256; do
            [ -f "$f" ] || { echo "(missing) $f"; continue; }
            echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
          done

      - name: Verify the record manifest
        id: manifest
        if: always() && steps.record.outputs.path != ''
        continue-on-error: true
        run: uv run cem verify-results "$VERIFY_RECORD"

      - name: Package the exact record for optional writeback
        id: package
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_RECORD:-}" ] || [ ! -d "$VERIFY_RECORD" ]; then
            echo "record_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          record_name="$(basename "$VERIFY_RECORD")"
          case "$record_name" in
            PALACE-VERIFY-*) ;;
            *) echo "refusing unexpected record name: $record_name" >&2; exit 1 ;;
          esac
          mkdir -p workflow-artifacts
          tar -C results -czf workflow-artifacts/palace-verify-writeback.tar.gz "$record_name"
          (cd workflow-artifacts && sha256sum palace-verify-writeback.tar.gz \
            > palace-verify-writeback.sha256)
          echo "record_created=true" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palace-verify-${{ github.run_id }}
          path: |
            ${{ steps.record.outputs.path }}
            workflow-artifacts
          if-no-files-found: warn

      - name: Fail the job if the campaign or the manifest check did not succeed
        if: always() && (steps.campaign.outcome != 'success' || steps.manifest.outcome == 'failure')
        run: |
          echo "campaign step  : ${{ steps.campaign.outcome }}"
          echo "manifest check : ${{ steps.manifest.outcome }}"
          exit 1

  writeback:
    name: commit the dispatched record
    needs: verify
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      inputs.commit_results &&
      needs.verify.outputs.record_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Download this run's record archive
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name "palace-verify-$RUN_ID" --dir "$RUNNER_TEMP/writeback"

      - name: Verify, extract and commit only the record
        env:
          TARGET_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/writeback/workflow-artifacts/palace-verify-writeback.tar.gz"
          checksum="$RUNNER_TEMP/writeback/workflow-artifacts/palace-verify-writeback.sha256"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$checksum")")
          record_name="$(python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              members = archive.getmembers()
          if not members:
              raise SystemExit("refusing an empty record archive")
          roots = set()
          for member in members:
              path = pathlib.PurePosixPath(member.name)
              if path.is_absolute() or ".." in path.parts or not path.parts:
                  raise SystemExit(f"refusing unsafe archive path: {member.name}")
              if member.issym() or member.islnk():
                  raise SystemExit(f"refusing archive link: {member.name}")
              roots.add(path.parts[0])
          if len(roots) != 1:
              raise SystemExit(f"refusing multiple archive roots: {sorted(roots)}")
          print(roots.pop())
          PY
          )"
          case "$record_name" in
            PALACE-VERIFY-*) ;;
            *) echo "refusing unexpected archive root: $record_name" >&2; exit 1 ;;
          esac
          mkdir -p results
          if [ -e "results/$record_name" ]; then
            echo "refusing to overwrite existing record: results/$record_name" >&2
            exit 1
          fi
          tar -xzf "$archive" -C results
          record="results/$record_name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$record"
          git commit -m "Record Palace verification campaign $RUN_ID" \
            -m "Workflow run: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"
