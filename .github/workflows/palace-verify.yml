# Palace mesh-refinement and height-sensitive verification (spec §15).
#
# NOT part of default CI (spec §12.8). Builds the pinned Palace container
# (layer cache shared with the golden-run workflow) and executes the frozen
# campaign in solvers/palace/verification.py through
# scripts/palace_verify_campaign.py: three meshes of the 22 x 22 x 1.5 mm box,
# the auxiliary 22 x 22 x 7.0/7.7 mm height benchmark, and the bounded
# Object 001 height attempts. Every outcome writes results/PALACE-VERIFY-<UTC>/
# with the frozen definition, every mesh and input deck, Palace's raw output,
# typed results, comparison tables, mode-matching decisions, the summary, the
# report and a manifest, which is re-hashed (a mismatch fails the job) and
# committed back to the branch the run was on.
#
# Triggers: manual dispatch; a push to `main` or a `palace/**` branch that
# touches the campaign, the executor or this file. The bot's own results
# commit does not match the filter and does not re-trigger.

name: Palace verification campaign

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated run names to execute (empty = the whole campaign)"
        default: ""
      commit_results:
        description: "Commit results/PALACE-VERIFY-* back to this branch"
        type: boolean
        default: true
  push:
    branches:
      - main
      - "palace/**"
    paths:
      - ".github/workflows/palace-verify.yml"
      - "scripts/palace_verify_campaign.py"
      - "solvers/palace/verification.py"

permissions:
  contents: write

concurrency:
  group: palace-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: qmhp-cem/palace:0.13.0
  ONLY: ${{ inputs.only || '' }}
  COMMIT_RESULTS: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_results }}

jobs:
  verify:
    name: build the image, run the verification campaign
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the Palace image (pinned base, apt snapshot, Palace tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/palace.Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image identity
        run: |
          docker image inspect "$IMAGE" --format 'id={{.Id}}  repo-digests={{json .RepoDigests}}'
          docker run --rm --network none --entrypoint /bin/sh "$IMAGE" -c 'cat /opt/palace/PALACE_VERSION /opt/palace/PALACE_COMMIT; echo "OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS OMP_NUM_THREADS=$OMP_NUM_THREADS"'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install gmsh runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1 libxfixes3 libxext6 libfontconfig1

      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev

      - name: Assert the mesher imports
        run: uv run python -c "import gmsh; print('gmsh', gmsh.__version__)"

      - name: Verification campaign
        id: campaign
        continue-on-error: true
        run: |
          args=()
          for name in $ONLY; do args+=(--only "$name"); done
          uv run python scripts/palace_verify_campaign.py --np 1 --results-root results --record-pointer "$RUNNER_TEMP/palace-verify-record" "${args[@]}"

      - name: Identify this run's record
        id: record
        if: always()
        run: |
          record="$(cat "$RUNNER_TEMP/palace-verify-record" 2>/dev/null || true)"
          if [ -z "$record" ] || [ ! -d "$record" ]; then
            echo "no record directory was created by this run (campaign step: ${{ steps.campaign.outcome }})"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "record directory: $record"
          echo "path=$record" >> "$GITHUB_OUTPUT"
          echo "VERIFY_RECORD=$record" >> "$GITHUB_ENV"

      - name: Report and summary
        if: always() && steps.record.outputs.path != ''
        run: |
          for f in "$VERIFY_RECORD"/report.md "$VERIFY_RECORD"/summary.json "$VERIFY_RECORD"/campaign.sha256; do
            [ -f "$f" ] || { echo "(missing) $f"; continue; }
            echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
          done

      - name: Verify the record manifest
        id: manifest
        if: always() && steps.record.outputs.path != ''
        continue-on-error: true
        run: uv run cem verify-results "$VERIFY_RECORD"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palace-verify-${{ github.run_id }}
          path: ${{ steps.record.outputs.path }}
          if-no-files-found: warn

      - name: Commit the verification record to the branch
        if: always() && env.COMMIT_RESULTS == 'true'
        run: |
          if [ -z "$VERIFY_RECORD" ]; then echo "no verification record to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERIFY_RECORD"
          verdicts="$(uv run python -c "import json,sys; v=json.load(open(sys.argv[1]))['verdicts']; print('mesh ' + v['mesh_convergence'] + ', aux height ' + v['height_sensitivity_aux'] + ', object001 height ' + v['height_sensitivity_object001'])" "$VERIFY_RECORD/summary.json")"
          git commit -m "Record Palace verification campaign ${{ github.run_id }}: ${verdicts}; campaign step ${{ steps.campaign.outcome }}, manifest ${{ steps.manifest.outcome }}" -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Fail the job if the campaign or the manifest check did not succeed
        if: always() && (steps.campaign.outcome != 'success' || steps.manifest.outcome == 'failure')
        run: |
          echo "campaign step  : ${{ steps.campaign.outcome }}"
          echo "manifest check : ${{ steps.manifest.outcome }}"
          exit 1
